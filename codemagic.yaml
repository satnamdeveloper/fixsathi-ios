workflows:
  ios-app-store-release:
    name: Flutter iOS App Store Release Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - app_store_credentials 
      vars:
        FLUTTER_VERSION: "stable"
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      xcode:
        latest: true
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Set up Flutter
        script: |
          flutter channel $FLUTTER_VERSION
          flutter upgrade
      - name: Initialize keychain
        script: |
          keychain initialize
      - name: Fetch signing profiles from Apple Developer Portal
        script: |
          app-store-connect fetch-signing-files "$APP_STORE_APP_ID" --profiles-type APP_STORE --create
      - name: Set up code signing in Xcode project
        script: |
          # Yeh command automatic export_options.plist file generate karti hai
          xcode-project use-profiles
      - name: Install Flutter dependencies and CocoaPods
        script: |
          flutter pub get
          cd ios && pod install --repo-update && cd ..
      - name: Build iOS IPA (Flutter)
        script: |
          # Codemagic builder ka exact standard path use kiya gaya hai
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true 
